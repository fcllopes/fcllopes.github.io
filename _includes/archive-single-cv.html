{% include base_path %}

{% assign post = include.post | default: post %}
{% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<li class="pub-item pub-item--cv">
  <span class="pub-item__title">{{ title }}</span>
  <span class="pub-item__meta">
    {{ post.authors }} · <em>{{ post.venue }}</em>, {{ post.date | default: "1900-01-01" | date: "%Y" }}
  </span>
</li>
